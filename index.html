function pad(n){return n<10?'0'+n:''+n}

function estimar(txt){var p=String(txt||'').trim().split(/\s+/).filter(Boolean).length;return Math.max(p?1:0,Math.min(100,Math.round(p/150)))}
function origemOk(est,origem,now){
  if(origem==='tudo')return true;
  if(origem==='novas')return !est;
  if(origem==='erros')return !!est&&!est.ok&&est.prox<=now;
  if(origem==='revisao')return !!est&&est.ok&&est.prox<=now;
  return !est||est.prox<=now;
}

  var set={};hist.forEach(function(h){set[diaKey(h.ts)]=1});
  var t=Date.now(),n=0;
  if(!set[diaKey(t)])t-=86400000;
  while(set[diaKey(t)]){n++;t-=86400000}
  return n;
}
function parseProva(txt){
  txt=String(txt||'').replace(/\r/g,'');
  var gab={},corpo=txt,gi=txt.search(/\n\s*gabarito[^\n]*\n/i);
  if(gi>=0){
    corpo=txt.slice(0,gi);
    var re=/(\d{1,3})\s*[-–:.)]?\s*([A-Ea-e])(?![A-Za-z])/g,m,gt=txt.slice(gi);
    while((m=re.exec(gt)))gab[+m[1]]=m[2].toUpperCase();
  }

  function fecha(){if(cur&&cur.alts.length>=2){cur.cor=gab[cur.num]!==undefined?gab[cur.num].charCodeAt(0)-65:null;if(cur.cor!==null&&cur.cor>=cur.alts.length)cur.cor=null;qs.push(cur)}cur=null}

  }

  return {questoes:qs,comGabarito:qs.filter(function(q){return q.cor!==null}).length};

var MANUAL='# Manual — Fênix | Banco de Questões v1.0\n\n## Primeiro acesso\nInforme seu primeiro nome (e e-mail, se quiser), aceite os Termos de Uso e a Política de Privacidade e escolha onde guardar os dados. Nesta versão os dados ficam só neste aparelho.\n\n## Estudar\nEscolha banca, prova, disciplina e assunto, a origem das questões (automática, novas, revisões ou erros) e a ordem (sequencial ou aleatória). Cada questão tem tempo de 1 minuto (configurável em Configurações). Ao responder, o acerto fica verde e o erro, vermelho; só então o gabarito e a explicação aparecem. Acabou o tempo, a questão conta como erro.\n\n## Revisão espaçada\nAcertos voltam a ser sugeridos após 5 dias; erros voltam na próxima simulação após 24 horas ou mais. Os dois prazos são configuráveis.\n\n## Simulado\nEscolha a prova, o tempo total (há o atalho Enem 6h) e o relógio: regressivo ou progressivo. As respostas só são corrigidas ao finalizar. O resultado mostra nota, tempo médio e as questões mais demoradas.\n\n## Metas\nInforme a prova e a data. O app calcula quantas questões por dia faltam e diz se você está no ritmo.\n\n## Banco\nCadastre questões digitando (enunciado, alternativas e a marcação da correta, que só aparece após a resposta) ou importe uma prova ou apostila em PDF ou texto. O app tenta ler localmente; se não reconhecer a estrutura, sugere quantas questões o material rende e pergunta se você quer todas ou uma quantidade. A IA usa a chave de API informada em Configurações, guardada só neste aparelho.\n\n## Explicação das questões\nDepois de responder, cada questão mostra "Por que a correta está correta" (passo a passo, com fórmulas e contas quando houver) e, se cadastrado, "Por que as outras estão erradas". Ao cadastrar uma questão, escreva a explicação nos campos próprios. Se a questão não tiver explicação, use o botão Explicar com IA (precisa da chave em Configurações) e salve o texto na questão; confira sempre a explicação da IA. No Banco, o marcador "sem explicação" e o filtro "Só questões sem explicação" mostram o que falta explicar.\n\n## Membros\nO gestor (primeiro acesso) cadastra os outros membros e acompanha o ranking. Menores só devem ser cadastrados com autorização do responsável legal.\n\n## Backup\nConfigurações > Dados: exporte e importe o backup. Limpar os dados do navegador apaga tudo; faça backup.\n\n## Aviso\n'+AVISO+' Ele aparece no primeiro acesso e uma vez por semana.\n';

function stats(mid){var h=H(mid),ac=h.filter(function(x){return x.ok}).length,hoje=diaKey(Date.now());
  var rev=0,err=0,now=Date.now(),e=S.estado[mid]||{};
  S.questoes.forEach(function(q){var s=e[q.id];if(s&&s.prox<=now){if(s.ok)rev++;else err++}});
  return {total:h.length,ac:ac,pct:h.length?Math.round(ac/h.length*100):0,hoje:h.filter(function(x){return diaKey(x.ts)===hoje}).length,rev:rev,err:err,seq:sequencia(h)}}
function dias14(mid){var h=H(mid),out=[];for(var i=13;i>=0;i--){var t=Date.now()-i*86400000,k=diaKey(t),d=h.filter(function(x){return diaKey(x.ts)===k}),a=d.filter(function(x){return x.ok}).length,s=0;d.forEach(function(x){s+=x.seg});out.push({k:t,pct:d.length?Math.round(a/d.length*100):null,min:Math.round(s/6)/10})}return out}

  var path=seg.split('|').join(' ');return '<svg viewBox="0 0 '+W+' '+Hh+'" width="100%" role="img" aria-label="Aproveitamento por dia"><line x1="'+p+'" y1="'+(Hh-p)+'" x2="'+(W-p)+'" y2="'+(Hh-p)+'" stroke="#d9dcea"/><text x="2" y="'+(p-4)+'" font-size="9" fill="#666">100%</text><text x="'+p+'" y="'+(Hh-8)+'" font-size="9" fill="#666">'+fmtData(d[0].k).slice(0,5)+'</text><text x="'+(W-p-24)+'" y="'+(Hh-8)+'" font-size="9" fill="#666">'+fmtData(d[13].k).slice(0,5)+'</text><path d="'+path+'" fill="none" stroke="#0076CE" stroke-width="2.5"/>'+pts.map(function(q){return '<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3.5" fill="#041273"/>'}).join('')+'</svg>'}
function chartBarras(d){var W=320,Hh=120,p=26,mx=Math.max.apply(null,d.map(function(x){return x.min}).concat([1])),bw=(W-2*p)/14;
  return '<svg viewBox="0 0 '+W+' '+Hh+'" width="100%" role="img" aria-label="Minutos de estudo por dia"><line x1="'+p+'" y1="'+(Hh-p)+'" x2="'+(W-p)+'" y2="'+(Hh-p)+'" stroke="#d9dcea"/><text x="2" y="'+(p-4)+'" font-size="9" fill="#666">'+mx+' min</text>'+d.map(function(x,i){var h=x.min/mx*(Hh-2*p);return '<rect x="'+(p+i*bw+2).toFixed(1)+'" y="'+(Hh-p-h).toFixed(1)+'" width="'+(bw-4).toFixed(1)+'" height="'+h.toFixed(1)+'" fill="#040798" rx="2"/>'}).join('')+'<text x="'+p+'" y="'+(Hh-8)+'" font-size="9" fill="#666">'+fmtData(d[0].k).slice(0,5)+'</text><text x="'+(W-p-24)+'" y="'+(Hh-8)+'" font-size="9" fill="#666">'+fmtData(d[13].k).slice(0,5)+'</text></svg>'}

function vMembros(){
  var m=cur(),rk=S.membros.map(function(x){var h=H(x.id),a=h.filter(function(y){return y.ok}).length;return {m:x,xp:xpDe(x.id),n:h.length,pct:h.length?Math.round(a/h.length*100):0}}).sort(function(a,b){return b.xp-a.xp});
  return '<h2>Membros e ranking</h2><div class="card"><h3>Ranking</h3>'+rk.map(function(r,i){return '<div class="q" style="cursor:default;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b>'+(['🥇','🥈','🥉'][i]||(i+1)+'º')+'</b><span style="flex:1"><b>'+esc(r.m.nome)+'</b>'+(r.m.gestor?' <span class="tag">gestor</span>':'')+(r.m.id===S.atual?' <span class="tag" style="background:var(--am)">ativo</span>':'')+'<br><small class="muted">Nível '+nivel(r.xp)+' · '+r.xp+' XP · '+r.n+' respostas · '+r.pct+'%</small></span>'+(r.m.id!==S.atual?'<button class="btn sec" data-act="entrarComo" data-id="'+r.m.id+'">Entrar como</button>':'')+(m.gestor&&!r.m.gestor?'<button class="btn red" data-act="rmMembro" data-id="'+r.m.id+'">Remover</button>':'')+'</div>'}).join('')+'<p class="muted">Neste aparelho, todos os membros compartilham o mesmo banco; o histórico e as revisões são individuais. Dica: use apelidos.</p></div>'
  +(m.gestor?'<div class="card"><h3>Adicionar membro</h3><label>Nome ou apelido</label><input id="n_nome"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="n_menor"> O membro é menor de 18 anos e tenho autorização do responsável legal.</label><div class="acts"><button class="btn" data-act="addMembro">Adicionar</button></div></div>':'<p class="muted">Só o gestor adiciona membros.</p>');
}

/* ---------- config ---------- */
function vConfig(){
  var c=S.config;
  return '<h2>Configurações</h2>'
  +'<details><summary>Estudo e revisão</summary><label>Tempo por questão no treino (segundos; 0 = sem limite)</label><input id="c_tq" type="number" min="0" value="'+c.tempoQuestao+'"><label>Refazer acertos após (dias)</label><input id="c_ea" type="number" min="1" value="'+c.espacAcerto+'"><label>Erros voltam após (horas, mínimo 24 recomendado)</label><input id="c_ee" type="number" min="1" value="'+c.espacErro+'"><label>Meta diária de questões</label><input id="c_md" type="number" min="1" value="'+c.metaDiaria+'"><div class="acts"><button class="btn" data-act="salvaCfg">Salvar</button></div><p class="muted">As mudanças valem para as próximas respostas.</p></details>'
  +'<details><summary>Armazenamento</summary><p>Os dados estão guardados <b>só neste aparelho</b>. Se você formatar o aparelho ou limpar os dados do navegador, tudo será perdido.</p><p class="muted">A opção na nuvem (vários aparelhos em tempo real) depende da integração com o Fênix Core e ainda não está disponível nesta versão.</p></details>'
  +'<details><summary>Inteligência artificial (importar apostilas)</summary><label>Chave de API</label><input id="c_key" type="password" autocomplete="off" value="'+esc(c.iaKey)+'" placeholder="sk-ant-..."><label>Modelo</label><input id="c_mod" value="'+esc(c.iaModelo)+'"><div class="acts"><button class="btn" data-act="salvaIA">Salvar</button></div><p class="muted">A chave fica só neste aparelho e nunca vai para o backup nem para a nuvem. O trecho do material enviado à IA é processado pelo provedor da chave.</p></details>'
  +'<details><summary>Dados e backup</summary><div class="acts"><button class="btn" data-act="expBackup">Exportar backup</button><button class="btn sec" data-act="impBackup">Importar backup</button></div><input type="file" id="f_bkp" accept=".json,application/json" style="display:none"><p class="muted">O backup não inclui a chave de API.</p></details>'
  +'<details><summary>Apagar dados</summary><p>Apaga <b>todos</b> os dados deste app neste aparelho (membros, banco, histórico). Isso não pode ser desfeito.</p><label>Digite APAGAR para liberar o botão</label><input id="c_ap" autocomplete="off"><div class="acts"><button class="btn red" id="b_ap" data-act="apagarTudo" disabled>Apagar tudo</button></div></details>';
}

/* ---------- sobre ---------- */
function vSobre(){
  return '<h2>Sobre</h2><div class="card"><h3>Fênix | Banco de Questões</h3><p>Versão <b>'+VERSAO+'</b> · selo <b>v'+VERSAO+' | c '+CORE_V+'</b></p><p class="muted">Fênix Soluções Tecnológicas — Aracaju/SE</p><p class="aviso">'+esc(AVISO)+'</p><div class="acts"><button class="btn sec" data-act="compartilhar">Compartilhar</button></div></div>'
  +'<details><summary>Changelog</summary>'+CHANGELOG.map(function(c){return '<p><b>v'+c.v+'</b> · criada em '+c.criado+' · modificada em '+c.mod+'<br>'+esc(c.t)+'</p>'}).join('')+'</details>'
  +'<details><summary>Manual do usuário</summary><pre>'+esc(MANUAL)+'</pre><div class="acts"><button class="btn sec" data-act="dlManual">Baixar manual (.md)</button></div></details>'
  +'<details><summary>Termos de Uso e Política de Privacidade</summary><p><a href="'+BASE+'Termos/" target="_blank" rel="noopener">Abrir Termos de Uso e Política de Privacidade oficiais</a></p></details>';
}

/* ---------- aviso semanal ---------- */
function checkAviso(){
  if(!S.membros.length||(SESS&&!SESS.fim))return;
  var t=S.aviso[S.atual];if(t&&Date.now()-t<7*86400000)return;
  abrirOv('<h3>Aviso importante</h3><p style="font-size:17px">'+esc(AVISO)+'</p><div class="acts"><button class="btn" data-act="entendi">Entendi</button></div>');
}

/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;var a=el.getAttribute('data-act'),d=el.dataset;
  switch(a){
    case 'go':go(d.v);break;
    case 'goBanco':go('banco');break;
    case 'goEstudar':PRE={o:d.o||'auto'};if(SESS&&SESS.fim)SESS=null;go('estudar');break;
    case 'onb':onb();break;
    case 'iniTreino':iniTreino();break;
    case 'resp':if(V==='simulado')respSim(+d.i);else resp(+d.i);break;
    case 'prox':prox();break;
    case 'sairSessao':sairSessao();break;
    case 'novoTreino':SESS=null;render();break;
    case 'preEnem':$('s_min').value=360;$('s_qtd').value=Math.min(90,S.questoes.length||90);break;
    case 'preQtd':$('s_min').value=Math.ceil((parseInt(val('s_qtd'),10)||1)*S.config.tempoQuestao/60);break;
    case 'iniSim':iniSim();break;
    case 'irSim':irSim(+d.i);break;
    case 'antSim':irSim(SESS.i-1);break;
    case 'proxSim':irSim(SESS.i+1);break;
    case 'finSim':finalizarSim(false);break;
    case 'novoSim':SESS=null;render();break;
    case 'novaQ':abrirOv(formQ());break;
    case 'editQ':abrirOv(formQ(qPorId(d.id)));break;
    case 'salvarQ':salvarQ(d.id);break;
    case 'delQ':if(confirm('Excluir esta questão? O histórico dela também deixa de aparecer.')){S.questoes=S.questoes.filter(function(q){return q.id!==d.id});save();fecharOv();render()}break;
    case 'fechar':fecharOv();break;
    case 'expBanco':expBanco();break;
    case 'impBanco':$('f_banco').click();break;
    case 'lerMat':lerMat();break;
    case 'gerarIA':gerarIA(!!d.todas);break;
    case 'salvarImp':salvarImp();break;
    case 'addMeta':if(!val('m_prova')||!val('m_data')){toast('Escolha a prova e a data.');break}S.metas.push({id:uid(),m:S.atual,prova:val('m_prova'),data:val('m_data')});save();render();break;
    case 'delMeta':S.metas=S.metas.filter(function(x){return x.id!==d.id});save();render();break;
    case 'treinaMeta':PRE={prova:d.p,o:'auto'};go('estudar');break;
    case 'simMeta':PRE={prova:d.p};go('simulado');break;
    case 'entrarComo':S.atual=d.id;save();render();checkAviso();break;
    case 'rmMembro':if(confirm('Remover este membro e o histórico dele?')){S.membros=S.membros.filter(function(x){return x.id!==d.id});S.hist=S.hist.filter(function(h){return h.m!==d.id});delete S.estado[d.id];S.metas=S.metas.filter(function(x){return x.m!==d.id});save();render()}break;
    case 'addMembro':if(!val('n_nome')){toast('Informe o nome ou apelido.');break}S.membros.push({id:uid(),nome:val('n_nome'),gestor:false,menor:$('n_menor').checked,inicio:Date.now()});save();render();toast('Membro adicionado.');break;
    case 'salvaCfg':var c=S.config;c.tempoQuestao=Math.max(0,parseInt(val('c_tq'),10)||0);c.espacAcerto=Math.max(1,parseInt(val('c_ea'),10)||5);c.espacErro=Math.max(1,parseInt(val('c_ee'),10)||24);c.metaDiaria=Math.max(1,parseInt(val('c_md'),10)||10);save();toast('Configurações salvas.');break;
    case 'salvaIA':S.config.iaKey=val('c_key');S.config.iaModelo=val('c_mod')||'claude-sonnet-5-5';save();toast('Configuração de IA salva.');break;
    case 'expBackup':var b=JSON.parse(JSON.stringify(S));b.config.iaKey='';down('fenix-banco-de-questoes-backup-'+diaKey(Date.now())+'.json',JSON.stringify(b),'application/json');break;
    case 'impBackup':$('f_bkp').click();break;
    case 'apagarTudo':if($('c_ap')&&$('c_ap').value==='APAGAR'){localStorage.removeItem(KEY);S=novo();SESS=null;V='inicio';render()}break;
    case 'compartilhar':var u=location.href,t='Conheça o Fênix | Banco de Questões: treine questões de provas com revisão espaçada e simulados.';if(navigator.share)navigator.share({title:'Fênix | Banco de Questões',text:t,url:u}).catch(function(){});else window.open('https://wa.me/?text='+encodeURIComponent(t+' '+u),'_blank');break;
    case 'dlManual':down('fenix-banco-de-questoes-manual-v'+VERSAO+'.md',MANUAL,'text/markdown');break;
    case 'entendi':S.aviso[S.atual]=Date.now();save();fecharOv();break;
    case 'avatar':abrirOv('<h3>'+esc(cur().nome)+'</h3><div class="acts"><button class="btn sec" data-act="ajuda">Ajuda</button>'+(S.membros.length>1?'<button class="btn sec" data-act="trocar">Trocar membro</button>':'')+'<button class="btn sec" data-act="fechar">Fechar</button></div>');break;
    case 'ajuda':fecharOv();go('sobre');break;
    case 'trocar':fecharOv();go('membros');break;
    case 'explIA':explIA(d.id);break;
    case 'salvaExpl':salvaExpl(d.id);break;
    case 'noop':break;
  }
});
document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='b_q'){BF.q=e.target.value;$('lista').innerHTML=listaQ()}
  if(id==='c_ap'){var b=$('b_ap');if(b)b.disabled=(e.target.value!=='APAGAR')}
});
document.addEventListener('change',function(e){
  var id=e.target.id;
  if(id==='b_banca'||id==='b_prova'||id==='b_disc'){BF[id.slice(2)]=e.target.value;$('lista').innerHTML=listaQ()}
  if(id==='b_sem'){BF.sem=e.target.checked;$('lista').innerHTML=listaQ()}
  if(id==='f_banco'&&e.target.files[0])impBancoArq(e.target.files[0]);
  if(id==='f_bkp'&&e.target.files[0])lerArq(e.target.files[0],function(t){try{var j=JSON.parse(t);if(!j.schema||!Array.isArray(j.membros))throw 0;if(!confirm('Substituir todos os dados deste aparelho pelo backup?'))return;var key=S.config.iaKey;S=j;S.config.iaKey=key;load2();save();render();toast('Backup importado.')}catch(x){toast('Arquivo de backup inválido.')}});
  if(e.target.id==='i_arq'||e.target.id==='i_txt'){}
});
function load2(){var b=novo();for(var k in b)if(S[k]===undefined)S[k]=b[k];for(var c in b.config)if(S.config[c]===undefined)S.config[c]=b.config[c];if(!membro(S.atual)&&S.membros.length)S.atual=S.membros[0].id}
window.addEventListener('beforeunload',function(e){if(SESS&&!SESS.fim){e.preventDefault();e.returnValue=''}});
window.addEventListener('online',conexao);window.addEventListener('offline',conexao);
document.addEventListener('keydown',function(e){if(e.key==='Escape')fecharOv()});
function boot(){load();load2();render();var s=$('splash');setTimeout(function(){s.style.opacity='0';setTimeout(function(){s.style.display='none'},260);checkAviso()},700)}
boot();
</script>
</body>
</html>
